name: VolleyTracker
options:
  bundleIdPrefix: com.vpanev
  deploymentTarget:
    iOS: "18.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.46.0

targets:
  VolleyTracker:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: VolleyTracker
    dependencies:
      - package: Supabase
    entitlements:
      path: VolleyTracker/VolleyTracker.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: VolleyTracker/Info.plist
      properties:
        CFBundleDisplayName: VolleyTracker
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.vpanev.volleytracker
            CFBundleURLSchemes:
              - volleytracker
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Add player and coach profile photos."
        NSCameraUsageDescription: "Take photos directly for player profiles."
        NSPhotoLibraryAddUsageDescription: "Save photos to your photo library."
    settings:
      base:
        PRODUCT_NAME: VolleyTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.vpanev.volleytracker
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: DP5G9GAZQJ
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
